name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci
      # Production dependencies only. The bar is `critical`, not the web
      # repo's `high`, because the Expo SDK's build tooling carries known
      # high and moderate advisories that only a major SDK bump clears;
      # raise it to `high` when that lands.
      - run: npm audit --omit=dev --audit-level=critical
